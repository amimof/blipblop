syntax = "proto3";

package services.leases.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "services/tasks/v1/tasks.proto";
import "types/v1/meta.proto";

option go_package = "github.com/amimof/voiyd/api/services/leases/v1;leases";

service LeaseService {
  rpc Get(GetRequest) returns (GetResponse) {
    option (google.api.http) = {get: "/api/v1/leases/{uid}"};
  }
  rpc List(ListRequest) returns (ListResponse) {
    option (google.api.http) = {get: "/api/v1/leases"};
  }
  rpc Acquire(AcquireRequest) returns (AcquireResponse) {
    option (google.api.http) = {post: "/api/v1/leases"};
  }
  rpc Release(ReleaseRequest) returns (ReleaseResponse) {
    option (google.api.http) = {delete: "/api/v1/leases/{id}"};
  }
  rpc Renew(RenewRequest) returns (RenewResponse) {
    option (google.api.http) = {
      put: "/api/v1/leases/{id}"
      additional_bindings: {patch: "/api/v1/leases/{id}"}
    };
  }
}

// Lease represents a node's right to run a task
message Lease {
  string version = 1;
  types.v1.Meta meta = 2 [(buf.validate.field).required = true];
  LeaseConfig config = 3 [(buf.validate.field).required = true];
}

message LeaseConfig {
  string task_id = 1 [(buf.validate.field).string.uuid = true];
  string node_id = 2 [(buf.validate.field).string.uuid = true];
  google.protobuf.Timestamp acquired_at = 3;
  google.protobuf.Timestamp renew_time = 4;
  google.protobuf.Timestamp expires_at = 5;
  uint32 ttl_seconds = 6;
  uint32 reschedule_count = 7;
  string original_node = 8;
}

message AcquireRequest {
  string task_id = 1 [(buf.validate.field).string.uuid = true];
  string node_id = 2 [(buf.validate.field).string.uuid = true];
}

message AcquireResponse {
  Lease lease = 1;
  bool acquired = 2;
  string holder = 3;
}

message RenewRequest {
  string id = 1;
  string task_id = 2 [(buf.validate.field).string.uuid = true];
  string node_id = 3 [(buf.validate.field).string.uuid = true];
}

message RenewResponse {
  Lease lease = 1;
  bool renewed = 2;
}

message ReleaseRequest {
  string id = 1;
  string task_id = 2 [(buf.validate.field).string.uuid = true];
  string node_id = 3 [(buf.validate.field).string.uuid = true];
}

message ReleaseResponse {
  bool released = 1;
}

message GetRequest {
  string uid = 1 [(buf.validate.field).string.uuid = true];
}

message GetResponse {
  Lease lease = 1;
}

message ListRequest {
  int32 limit = 1;
  map<string, string> selector = 2;
  bool expired_only = 3;
}

message ListResponse {
  repeated Lease leases = 1;
}
